name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: mlj.one
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            git config --global --add safe.directory /var/www/www.foodnotfrenzy.com
            cd /var/www/www.foodnotfrenzy.com
            git pull origin main
            # Runs `artisan package:discover` + `craft:setup:publish` via post-autoload-dump.
            composer install --no-dev --no-interaction --optimize-autoloader
            # Craft 6: `up` runs core migrations, applies project config, then
            # content migrations. (`migrate/all --interactive=0` no longer parses.)
            php craft up --no-interaction
            php craft clear-caches/all
